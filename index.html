<!DOCTYPE html>
<html>
<head>
  <title>goapp.in</title>
  <style>
    body {
      background: black;
      color: #00ff00;
      font-family: "Courier New", monospace;
      margin: 0;
      padding: 20px;
      overflow: hidden;
    }

    #terminal {
      white-space: pre-line;
      font-size: 16px;
    }

    .cursor {
      display: inline-block;
      width: 10px;
      background: #00ff00;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0% { opacity: 0 }
      50% { opacity: 1 }
      100% { opacity: 0 }
    }

    #hidden {
      display: none;
      margin-top: 20px;
      color: red;
      font-size: 18px;
    }

    button {
      background: transparent;
      border: 1px solid #00ff00;
      color: #00ff00;
      padding: 10px;
      margin-top: 20px;
      cursor: pointer;
    }

    button:hover {
      background: #00ff00;
      color: black;
    }
  </style>
</head>
<body>

<div id="terminal"></div>
<span class="cursor"></span>

<div id="hidden">
  🔓 ACCESS GRANTED  
  <br><br>
  Welcome to GoBank Core System  
  <br><br>
  <button onclick="location.href='https://goapp.in'">
    Enter Secure System
  </button>
</div>

<script>
  const terminal = document.getElementById("terminal");

  const lines = [
    "Initializing secure protocol...",
    "Connecting to encrypted banking server...",
    "IP detected: 192.168.0.7",
    "Bypassing firewall...",
    "Decrypting credentials...",
    "Scanning system vulnerabilities...",
    "Access level: RESTRICTED",
    "Authentication required...",
    "Type 'root' to continue..."
  ];

  let i = 0;

  function typeLine() {
    if (i < lines.length) {
      terminal.innerHTML += lines[i] + "\n";
      i++;
      setTimeout(typeLine, 800);
    }
  }

  typeLine();

  document.addEventListener("keydown", function(e) {
    if (e.key.toLowerCase() === "r") {
      document.getElementById("hidden").style.display = "block";
    }
  });
</script>

</body>
</html>
