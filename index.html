<!DOCTYPE html>
<html>
<head>
  <title>goapp.in</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden;
      font-family: monospace;
      color: #00ff00;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    #message {
      position: absolute;
      width: 100%;
      text-align: center;
      top: 40%;
      font-size: 40px;
      color: red;
      letter-spacing: 5px;
    }

    #sub {
      position: absolute;
      width: 100%;
      text-align: center;
      top: 55%;
      font-size: 20px;
      color: white;
    }

    .shake {
      animation: shake 0.2s infinite;
    }

    @keyframes shake {
      0% { transform: translate(0,0); }
      25% { transform: translate(5px,-5px); }
      50% { transform: translate(-5px,5px); }
      75% { transform: translate(5px,5px); }
      100% { transform: translate(0,0); }
    }

    #startScreen {
      position: absolute;
      width: 100%;
      height: 100%;
      background: black;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      z-index: 10;
      cursor: pointer;
    }

  </style>
</head>
<body>

<div id="startScreen">CLICK TO ACCESS SYSTEM</div>

<canvas id="matrix"></canvas>

<div id="message"></div>
<div id="sub"></div>

<audio id="creepySound" loop>
  <source src="https://www.soundjay.com/horror/horror-ambience-01.mp3" type="audio/mpeg">
</audio>

<script>
  const startScreen = document.getElementById("startScreen");
  const sound = document.getElementById("creepySound");
  const message = document.getElementById("message");
  const sub = document.getElementById("sub");

  startScreen.onclick = function() {
    startScreen.style.display = "none";
    sound.play();
    startHorror();
  };

  function startHorror() {

    // MATRIX
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");
    canvas.height = window.innerHeight;
    canvas.width = window.innerWidth;

    const letters = "01";
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = [];

    for (let x = 0; x < columns; x++) {
      drops[x] = 1;
    }

    function draw() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#0F0";
      ctx.font = fontSize + "px monospace";

      for (let i = 0; i < drops.length; i++) {
        const text = letters.charAt(Math.floor(Math.random() * letters.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975)
          drops[i] = 0;
        drops[i]++;
      }
    }

    setInterval(draw, 33);

    // HORROR SEQUENCE
    setTimeout(() => {
      message.textContent = "WE SEE YOU";
      document.body.classList.add("shake");
    }, 3000);

    setTimeout(() => {
      sub.textContent = "Your device is being scanned...";
    }, 6000);

    setTimeout(() => {
      document.body.style.background = "darkred";
    }, 9000);

    setTimeout(() => {
      message.textContent = "YOU SHOULD NOT BE HERE";
      sub.textContent = "";
    }, 12000);

    setTimeout(() => {
      message.textContent = "GOODBYE.";
      document.body.style.background = "black";
    }, 16000);
  }

</script>

</body>
</html>
