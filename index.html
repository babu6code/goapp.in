<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Priya ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: radial-gradient(circle at top, #1a1a2e, #0f0f1a);
    color: white;
    overflow: hidden;
}

/* Center container */
.container {
    text-align: center;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

/* Elegant heading */
h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 60px;
    color: #ff4d6d;
    margin-bottom: 10px;
    animation: fadeIn 2s ease-in-out;
}

/* Message */
p {
    font-size: 20px;
    max-width: 600px;
    margin: auto;
    line-height: 1.6;
    opacity: 0;
    animation: fadeIn 3s ease forwards;
    animation-delay: 1s;
}

/* Button */
button {
    margin-top: 30px;
    padding: 12px 25px;
    font-size: 16px;
    border: none;
    border-radius: 25px;
    background: #ff4d6d;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #ff1e4d;
    transform: scale(1.05);
}

/* Hidden surprise */
#surprise {
    display: none;
    margin-top: 30px;
    font-size: 22px;
    color: #ff8fa3;
    animation: fadeIn 2s ease-in-out;
}

/* Floating hearts */
.heart {
    position: absolute;
    bottom: -20px;
    color: #ff4d6d;
    font-size: 20px;
    animation: float 6s linear infinite;
}

@keyframes float {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-800px); opacity: 0; }
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}
</style>
</head>

<body>

<div class="container">
    <h1>Happy Birthday, Priya ❤️</h1>

    <button onclick="showSurprise()">Click Here</button>

    <div id="surprise">
        I promise we’ll live, laugh, and grow together through every phase of life,  
        hand in hand, with love and trust that grows stronger every day. 💖
    </div>
</div>

<script>
function showSurprise() {
    document.getElementById("surprise").style.display = "block";
}

/* Floating hearts generator */
setInterval(() => {
    let heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 10) + "px";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}, 300);
</script>

</body>
</html>
