<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Surprise</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #ff9a9e, #fad0c4);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }

    .card {
        background: white;
        padding: 30px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        animation: fadeIn 2s ease-in-out;
    }

    h1 {
        color: #ff4d6d;
    }

    p {
        font-size: 18px;
        color: #555;
    }

    .heart {
        font-size: 30px;
        animation: heartbeat 1.5s infinite;
        color: red;
    }

    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(20px);}
        to {opacity: 1; transform: translateY(0);}
    }

    @keyframes heartbeat {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.2); }
    }
</style>
</head>
<body>

<div class="card">
    <h1>Happy Birthday, Priya ❤️</h1>
    <p>
        I’m looking forward to a beautiful life with you,
        filled with love, laughter, and endless memories.
    </p>
    <div class="heart">💖</div>
</div>

</body>
</html>
