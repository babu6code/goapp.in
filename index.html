<!DOCTYPE html>
<html>
<head>
  <title>goapp.in</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden;
      font-family: monospace;
      color: #00ff00;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    #warning {
      position: absolute;
      width: 100%;
      text-align: center;
      top: 40%;
      font-size: 40px;
      letter-spacing: 5px;
      animation: flicker 2s infinite;
    }

    @keyframes flicker {
      0% {opacity:1;}
      5% {opacity:0.1;}
      10% {opacity:1;}
      15% {opacity:0.3;}
      20% {opacity:1;}
      100% {opacity:1;}
    }

    #glitch {
      position: absolute;
      top: 55%;
      width: 100%;
      text-align: center;
      font-size: 20px;
      color: red;
    }
  </style>
</head>
<body>

<canvas id="matrix"></canvas>

<div id="warning">⚠ SYSTEM BREACH DETECTED ⚠</div>
<div id="glitch">Tracking IP...</div>

<script>
  // MATRIX RAIN EFFECT
  const canvas = document.getElementById("matrix");
  const ctx = canvas.getContext("2d");

  canvas.height = window.innerHeight;
  canvas.width = window.innerWidth;

  const letters = "01";
  const fontSize = 16;
  const columns = canvas.width / fontSize;

  const drops = [];
  for (let x = 0; x < columns; x++) {
    drops[x] = 1;
  }

  function draw() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#0F0";
    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < drops.length; i++) {
      const text = letters.charAt(Math.floor(Math.random() * letters.length));
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);

      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975)
        drops[i] = 0;

      drops[i]++;
    }
  }

  setInterval(draw, 33);

  // RANDOM GLITCH TEXT
  const glitchText = document.getElementById("glitch");
  const messages = [
    "Accessing camera...",
    "Decrypting device...",
    "Firewall compromised...",
    "Location traced...",
    "Unauthorized activity detected...",
    "Connecting to mainframe..."
  ];

  setInterval(() => {
    glitchText.textContent =
      messages[Math.floor(Math.random() * messages.length)];
  }, 2000);

  // RANDOM SCREEN FLASH
  setInterval(() => {
    if (Math.random() > 0.85) {
      document.body.style.background = "darkred";
      setTimeout(() => {
        document.body.style.background = "black";
      }, 100);
    }
  }, 1000);

</script>

</body>
</html>
