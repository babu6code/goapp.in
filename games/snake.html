<!DOCTYPE html>
<html>
<head>
<title>Snake</title>
<style>
canvas { background:black; display:block; margin:50px auto; }
</style>
</head>
<body>
<canvas id="game" width="400" height="400"></canvas>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let snake = [{x:200,y:200}];
let dx = 20;
let dy = 0;
let food = {x:100,y:100};

document.addEventListener("keydown", e=>{
 if(e.key==="ArrowUp"){dx=0;dy=-20;}
 if(e.key==="ArrowDown"){dx=0;dy=20;}
 if(e.key==="ArrowLeft"){dx=-20;dy=0;}
 if(e.key==="ArrowRight"){dx=20;dy=0;}
});

function draw(){
 ctx.clearRect(0,0,400,400);

 snake.unshift({x:snake[0].x+dx,y:snake[0].y+dy});
 snake.pop();

 ctx.fillStyle="lime";
 snake.forEach(p=>ctx.fillRect(p.x,p.y,20,20));

 ctx.fillStyle="red";
 ctx.fillRect(food.x,food.y,20,20);
}

setInterval(draw,100);
</script>
</body>
</html>
